[package]
name = "pong"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {
    version = "0.19.1",
    default-features = false,
    features = ["2d", "dynamic_linking"]
}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
